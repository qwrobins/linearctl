name: CI

on:
  workflow_call:
    inputs:
      commit:
        description: Exact commit to validate
        required: true
        type: string
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit || github.sha }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - run: bun install --frozen-lockfile

      # Must run before any build can silently repair stale committed artifacts.
      - name: Check generated artifacts
        run: bun run check:generated

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

      - name: Build
        run: bun run build

      - name: Build binary
        run: bun run build:binary

      - name: Validate PowerShell installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path .\install.ps1),
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            throw ($errors | Out-String)
          }

      - name: Test PowerShell installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\tests\install\windows-installer.test.ps1

      - name: Smoke test binary
        run: bun run smoke:binary
