name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: bun-linux-x64
            artifact: linear-linux-x64
          - os: ubuntu-latest
            target: bun-linux-arm64
            artifact: linear-linux-arm64
          - os: macos-latest
            target: bun-darwin-x64
            artifact: linear-darwin-x64
          - os: macos-latest
            target: bun-darwin-arm64
            artifact: linear-darwin-arm64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - name: Build binary
        env:
          BUILD_TARGET: ${{ matrix.target }}
          ARTIFACT_NAME: ${{ matrix.artifact }}
        run: bun build src/cli/main.ts --compile --target="$BUILD_TARGET" --outfile "dist/$ARTIFACT_NAME"

      - name: Smoke test binary
        if: matrix.target == 'bun-linux-x64' || matrix.target == 'bun-darwin-arm64'
        env:
          ARTIFACT_NAME: ${{ matrix.artifact }}
        run: ./dist/"$ARTIFACT_NAME" --help

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release assets
        run: |
          mkdir -p release
          for dir in artifacts/*/; do
            name=$(basename "$dir")
            cp "$dir/$name" "release/$name"
            chmod +x "release/$name"
          done
          cd release
          for f in *; do
            sha256sum "$f" >> checksums.txt
          done

      - name: Extract changelog for version
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          version="${TAG_NAME#v}"
          # Extract the section for this version from CHANGELOG.md
          sed -n "/^## \[${version}\]/,/^## \[/p" CHANGELOG.md | sed '$d' > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "Release ${TAG_NAME}" > release-notes.md
          fi

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG_NAME" > /dev/null 2>&1; then
            echo "Release $TAG_NAME already exists, uploading assets..."
            gh release upload "$TAG_NAME" --clobber release/*
          else
            gh release create "$TAG_NAME" \
              --title "$TAG_NAME" \
              --notes-file release-notes.md \
              release/*
          fi
