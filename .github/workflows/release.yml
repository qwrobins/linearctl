name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v0.2.0)"
        required: true

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: bun-linux-x64
            artifact: linearctl-linux-x64
          - os: ubuntu-latest
            target: bun-linux-arm64
            artifact: linearctl-linux-arm64
          - os: macos-latest
            target: bun-darwin-x64
            artifact: linearctl-darwin-x64
          - os: macos-latest
            target: bun-darwin-arm64
            artifact: linearctl-darwin-arm64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - name: Build binary
        env:
          BUILD_TARGET: ${{ matrix.target }}
          ARTIFACT_NAME: ${{ matrix.artifact }}
        run: bun build src/cli/main.ts --compile --target="$BUILD_TARGET" --outfile "dist/$ARTIFACT_NAME"

      - name: Smoke test binary
        if: matrix.target == 'bun-linux-x64' || matrix.target == 'bun-darwin-arm64'
        env:
          ARTIFACT_NAME: ${{ matrix.artifact }}
        run: ./dist/"$ARTIFACT_NAME" --help

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Validate tag matches package.json version
        env:
          TAG_NAME: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          tag_version="${TAG_NAME#v}"
          pkg_version=$(python3 -c 'import json;print(json.load(open("package.json"))["version"])')
          if [ "$tag_version" != "$pkg_version" ]; then
            echo "Error: tag version ($tag_version) does not match package.json version ($pkg_version)" >&2
            exit 1
          fi

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release assets
        run: |
          mkdir -p release
          for dir in artifacts/*/; do
            name=$(basename "$dir")
            cp "$dir/$name" "release/$name"
            chmod +x "release/$name"
          done

      - name: Build deb packages
        env:
          TAG_NAME: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          version="${TAG_NAME#v}"
          for arch_pair in "x64:amd64" "arm64:arm64"; do
            bun_arch="${arch_pair%%:*}"
            deb_arch="${arch_pair##*:}"
            binary="release/linearctl-linux-${bun_arch}"
            deb_name="linearctl_${version}_${deb_arch}"

            if [ ! -f "$binary" ]; then
              echo "Skipping $deb_arch — binary not found"
              continue
            fi

            mkdir -p "${deb_name}/DEBIAN"
            mkdir -p "${deb_name}/usr/bin"

            cp "$binary" "${deb_name}/usr/bin/linearctl"
            chmod 755 "${deb_name}/usr/bin/linearctl"

            cat > "${deb_name}/DEBIAN/control" << CTRL
          Package: linearctl
          Version: ${version}
          Architecture: ${deb_arch}
          Maintainer: qwrobins
          Description: Agent-first CLI for the Linear API
           Built for LLM coding agents like Claude Code and Codex.
           Three command layers: curated, generated API, and raw GraphQL.
          CTRL
            # Remove leading whitespace from heredoc
            sed -i 's/^          //' "${deb_name}/DEBIAN/control"

            dpkg-deb --build "$deb_name" "release/${deb_name}.deb"
            echo "Built release/${deb_name}.deb"
          done

      - name: Generate checksums
        run: |
          cd release
          sha256sum * > checksums.txt

      - name: Extract changelog for version
        env:
          TAG_NAME: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          version="${TAG_NAME#v}"
          # Extract the section for this version from CHANGELOG.md
          sed -n "/^## \[${version}\]/,/^## \[/p" CHANGELOG.md | sed '$d' > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "Release ${TAG_NAME}" > release-notes.md
          fi

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          if gh release view "$TAG_NAME" > /dev/null 2>&1; then
            echo "Release $TAG_NAME already exists, uploading assets..."
            gh release upload "$TAG_NAME" --clobber release/*
          else
            gh release create "$TAG_NAME" \
              --title "$TAG_NAME" \
              --notes-file release-notes.md \
              release/*
          fi
