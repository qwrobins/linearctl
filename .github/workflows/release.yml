name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v0.2.0)"
        required: true

permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      commit: ${{ steps.commit.outputs.sha }}
      tag: ${{ steps.tag.outputs.name }}
    steps:
      - name: Validate tag format
        id: tag
        env:
          TAG_NAME: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          if ! [[ "$TAG_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Error: expected vX.Y.Z or vX.Y.Z-suffix" >&2
            exit 1
          fi
          echo "name=$TAG_NAME" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          # A manual input must name an existing tag, never a branch or arbitrary ref.
          ref: refs/tags/${{ steps.tag.outputs.name }}

      - name: Resolve exact release commit and validate version
        id: commit
        env:
          TAG_NAME: ${{ steps.tag.outputs.name }}
        run: |
          pkg_version=$(python3 -c 'import json;print(json.load(open("package.json"))["version"])')
          if [ "${TAG_NAME#v}" != "$pkg_version" ]; then
            echo "Error: tag does not match package.json version" >&2
            exit 1
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  validate:
    needs: resolve
    uses: ./.github/workflows/ci.yml
    with:
      commit: ${{ needs.resolve.outputs.commit }}

  build:
    needs: [resolve, validate]
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: bun-linux-x64
            binary: linearctl-linux-x64
            artifact: linearctl-linux-x64
          - os: ubuntu-24.04-arm
            target: bun-linux-arm64
            binary: linearctl-linux-arm64
            artifact: linearctl-linux-arm64
          - os: macos-15-intel
            target: bun-darwin-x64
            binary: linearctl-darwin-x64
            artifact: linearctl-darwin-x64
          - os: macos-latest
            target: bun-darwin-arm64
            binary: linearctl-darwin-arm64
            artifact: linearctl-darwin-arm64
          - os: windows-latest
            target: bun-windows-x64
            binary: linearctl.exe
            artifact: linearctl-windows-x64.zip

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.commit }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - run: bun install --frozen-lockfile

      - name: Check generated artifacts
        run: bun run check:generated

      - name: Build binary
        run: bun run build:binary --target=${{ matrix.target }} --outfile=dist/${{ matrix.binary }}

      - name: Sign, notarize, and verify macOS binary
        if: runner.os == 'macOS'
        shell: bash
        env:
          BINARY_NAME: ${{ matrix.binary }}
          MACOS_CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: bash scripts/sign-macos-release.sh "./dist/$BINARY_NAME"

      - name: Smoke test binary
        run: bun run smoke:binary dist/${{ matrix.binary }}

      - name: Package Windows release
        if: matrix.target == 'bun-windows-x64'
        shell: pwsh
        env:
          BINARY_NAME: ${{ matrix.binary }}
          ARTIFACT_NAME: ${{ matrix.artifact }}
        run: |
          $binaryPath = Join-Path "dist" $env:BINARY_NAME
          $archivePath = Join-Path "dist" $env:ARTIFACT_NAME
          Compress-Archive -LiteralPath $binaryPath -DestinationPath $archivePath -CompressionLevel Optimal

      - name: Smoke test Windows release archive
        if: matrix.target == 'bun-windows-x64'
        shell: pwsh
        env:
          ARTIFACT_NAME: ${{ matrix.artifact }}
        run: |
          $archivePath = Join-Path "dist" $env:ARTIFACT_NAME
          $extractPath = Join-Path $env:RUNNER_TEMP "linearctl-release-archive"
          Expand-Archive -LiteralPath $archivePath -DestinationPath $extractPath

          $expectedBinary = Join-Path $extractPath "linearctl.exe"
          $archivedFiles = @(Get-ChildItem -LiteralPath $extractPath -File -Recurse)
          if ($archivedFiles.Count -ne 1 -or $archivedFiles[0].FullName -ne $expectedBinary) {
            throw "$env:ARTIFACT_NAME must contain only linearctl.exe at the archive root."
          }
          bun run smoke:binary $expectedBinary
          if ($LASTEXITCODE -ne 0) { throw "Archived binary smoke test failed." }

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}
          if-no-files-found: error

  verify-macos:
    # Fresh machines: no signing keychain or notarization cache from the build.
    needs: [resolve, build]
    strategy:
      matrix:
        include:
          - os: macos-15-intel
            artifact: linearctl-darwin-x64
          - os: macos-latest
            artifact: linearctl-darwin-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.commit }}

      - uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist

      - name: Verify quarantined macOS release on a clean runner
        shell: bash
        env:
          BINARY_NAME: ${{ matrix.artifact }}
        run: bash scripts/verify-macos-release.sh "./dist/$BINARY_NAME"

  release:
    needs: [resolve, validate, build, verify-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG_NAME: ${{ needs.resolve.outputs.tag }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.commit }}

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release assets
        run: |
          mkdir -p release
          for dir in artifacts/*/; do
            name=$(basename "$dir")
            cp "$dir/$name" "release/$name"
            chmod +x "release/$name"
          done

      - name: Build deb packages
        run: |
          version="${TAG_NAME#v}"
          for arch_pair in "x64:amd64" "arm64:arm64"; do
            bun_arch="${arch_pair%%:*}"
            deb_arch="${arch_pair##*:}"
            binary="release/linearctl-linux-${bun_arch}"
            deb_name="linearctl_${version}_${deb_arch}"

            if [ ! -f "$binary" ]; then
              echo "Skipping $deb_arch — binary not found"
              continue
            fi

            mkdir -p "${deb_name}/DEBIAN"
            mkdir -p "${deb_name}/usr/bin"

            cp "$binary" "${deb_name}/usr/bin/linearctl"
            chmod 755 "${deb_name}/usr/bin/linearctl"

            cat > "${deb_name}/DEBIAN/control" << CTRL
          Package: linearctl
          Version: ${version}
          Architecture: ${deb_arch}
          Maintainer: qwrobins
          Description: Agent-first CLI for the Linear API
           Built for LLM coding agents like Claude Code and Codex.
           Three command layers: curated, generated API, and raw GraphQL.
          CTRL
            # Remove leading whitespace from heredoc
            sed -i 's/^          //' "${deb_name}/DEBIAN/control"

            dpkg-deb --build "$deb_name" "release/${deb_name}.deb"
            echo "Built release/${deb_name}.deb"
          done

      - name: Generate checksums
        run: |
          cd release
          sha256sum * > checksums.txt

      - name: Extract changelog for version
        run: |
          version="${TAG_NAME#v}"
          # Extract the section for this version from CHANGELOG.md
          sed -n "/^## \[${version}\]/,/^## \[/p" CHANGELOG.md | sed '$d' > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "Release ${TAG_NAME}" > release-notes.md
          fi

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ needs.resolve.outputs.commit }}
        run: |
          # Reject a deleted or moved tag instead of publishing validated assets under it.
          git fetch --no-tags origin "refs/tags/$TAG_NAME"
          if [ "$(git rev-parse 'FETCH_HEAD^{commit}')" != "$RELEASE_COMMIT" ]; then
            echo "Error: release tag moved after validation" >&2
            exit 1
          fi
          if gh release view "$TAG_NAME" > /dev/null 2>&1; then
            echo "Release $TAG_NAME already exists, uploading assets..."
            gh release upload "$TAG_NAME" --clobber release/*
          else
            gh release create "$TAG_NAME" --verify-tag \
              --title "$TAG_NAME" \
              --notes-file release-notes.md \
              release/*
          fi
